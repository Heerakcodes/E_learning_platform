{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🔐</div>
            <h2>Welcome Back!</h2>
            <p>Log in to continue learning</p>
        </div>

        <!--
            IMPORTANT: Every POST form in Django MUST include csrf_token.
            CSRF = Cross-Site Request Forgery protection.
            It adds a hidden security token to verify the form came from our site.
        -->
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">
                🚀 Log In
            </button>
        </form>

        <p class="text-center mt-3" style="font-size:0.9rem;">
            Don't have an account?
            <a href="{% url 'register' %}" style="font-weight:600;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
